query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  shop {
    localTime {
      isCampaignPeriod: dateTimeBetween(
        startDateTime: "2026-09-08T00:00:00"
        endDateTime: "2026-09-18T23:59:59"
      )
    }
    metaobject(
      handle: {
        type: "app--379210334209--gwp"
        handle: "app--379210334209--gwp-usymljaq"
      }
    ) {
      condition_type: field(key: "condition_type") {
        value
      }
    }
  }
  cart {
    buyerIdentity {
      customer {
        hasTags(tags: ["gwp-test"]) {
          hasTag
          tag
        }
      }
    }
    cost {
      totalAmount {
        amount
        currencyCode
      }
    }
    lines {
      cost {
        subtotalAmount {
          amount
        }
        totalAmount {
          amount
        }
      }
      discountAllocations {
        discountedAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
}
